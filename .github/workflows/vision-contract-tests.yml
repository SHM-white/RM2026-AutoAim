name: Vision contracts
on:
  pull_request:
  push:
    branches: [main, 'refactor/**']

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install minimal CPU test dependencies
        run: sudo apt-get update && sudo apt-get install -y libopencv-dev libeigen3-dev
      - name: Configure hardware-free tests
        run: cmake -S tests/contracts -B build/contracts -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build/contracts --parallel 2
      - name: Run contract tests
        run: ctest --test-dir build/contracts --output-on-failure
